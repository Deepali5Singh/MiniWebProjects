<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SignUp Page</title>
</head>
<body>
    <h1>SignUp Page</h1>

    <form onsubmit="return validateAndCheckUser();" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name"><br>

        <label for="age">Age:</label>
        <input type="number" id="age"><br>

        <label for="mobile">Mobile Number (10 digits):</label>
        <input type="tel" id="mobile"><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email"><br>

        <label for="country">Country:</label>
        <select id="country">
            <option value="">--Select Country--</option>
            <option value="India">India</option>
            <option value="America">America</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Canada">Canada</option>
        </select><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <script>
        // Pre-approved users list
        const allowedUsers = [
            { name: "Ramesh Sinha", age: 16, email: "ramesh123@gmail.com", mobile: "0123456789", country: "India" },
            { name: "Shreya",       age: 18, email: "shreya123@gmail.com", mobile: "0123456789", country: "India" },
            { name: "Sonia",        age: 20, email: "sonia123@gmail.com",  mobile: "0123456789", country: "India" },
            { name: "Kiran",        age: 17, email: "kiran123@gmail.com",  mobile: "0123456789", country: "India" },
            { name: "Amit Kumar",   age: 22, email: "amit123@gmail.com",   mobile: "9123456780", country: "India" }
        ];

        function validateAndCheckUser() {
            const name = document.getElementById('name').value.trim();
            const ageInput = document.getElementById('age').value.trim();
            const age = Number(ageInput);
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value;

            // 1. Basic Format Validations
            if (name.length < 5 || name.length > 15) {
                alert("Name must be between 5 and 15 characters.");
                document.getElementById('name').focus();
                return false;
            }

            if (ageInput === "" || age <= 15 || age >= 50) {
                alert("Age must be greater than 15 and less than 50.");
                document.getElementById('age').focus();
                return false;
            }

            const phonePattern = /^[0-9]{10}$/;
            if (!phonePattern.test(mobile)) {
                alert("Enter a valid 10-digit mobile number.");
                document.getElementById('mobile').focus();
                return false;
            }

            const emailPattern = /^[^@]+@[^@]+\.[a-z]{2,}$/i;
            if (!emailPattern.test(email)) {
                alert("Enter a valid email address.");
                document.getElementById('email').focus();
                return false;
            }

            if (country === "") {
                alert("Please select a country.");
                document.getElementById('country').focus();
                return false;
            }

            // 2. Check if the entered details match any of the allowed users
            const matchedUser = allowedUsers.find(user => 
                user.name.toLowerCase() === name.toLowerCase() &&
                user.email.toLowerCase() === email.toLowerCase() &&
                user.age === age &&
                user.mobile === mobile &&
                user.country.toLowerCase() === country.toLowerCase()
            );

            if (matchedUser) {
                alert("Signup successful! Redirecting to file upload page...");
                // Redirects to upload.html in the same directory
                window.location.href = "upload.html";
            } else {
                alert("User not recognized or details do not match pre-approved records!");
            }

            // Stops page reload so redirection can execute smoothly
            return false;
        }
    </script>
</body>
</html>
