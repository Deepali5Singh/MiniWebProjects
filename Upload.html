<body>

    <div class="card">
        <h2>AI Resume Analyzer</h2>
        <p class="subtitle">Evaluates candidate skills directly </p>

        <label for="jdInput">Target Job Description (JD):</label>
        <textarea id="jdInput" placeholder="Paste the target job description or core skill requirements here (e.g. Java, Spring Boot, Microservices, REST APIs, SQL)..."></textarea>

        <div class="file-upload-box">
            <label for="resumeFile">Select Resume File (.pdf):</label>
            <input type="file" id="resumeFile" class="file-input" accept=".pdf">
        </div>

        <button type="button" id="submitBtn" class="btn" onclick="uploadAndAnalyze();">
            <span id="btnText">Analyze Against JD</span>
        </button>
    </div>

    <!-- Evaluation Report Output -->
    <div id="resultsCard" class="card">
        <div class="metric-header">
            <div>
                <h3 style="margin-bottom: 4px;">Candidate Report</h3>
                <span style="color: #64748b; font-size: 14px;">ATS Score:</span> 
                <strong id="resName" style="color: var(--slate-800);"></strong>
            </div>
            <div class="score-box">
                <div class="score-val"><span id="resScore">0</span><span style="font-size: 18px; color: #94a3b8;">/100</span></div>
                <!-- <div class="score-sub">ATS Match Score</div> -->
            </div>
        </div>

        <div class="summary-box">
            <strong>Match Keyword:</strong>
            <p id="resSummary" style="margin: 6px 0 0 0;"></p>
        </div>

        <div class="skills-grid">
            <div>
                <h4>Missing Keyword</h4>
                <div id="resSkills" class="tag-container"></div>
            </div>
            <div>
                <!-- <h4>Missing / Recommended</h4> -->
                <div id="resMissing" class="tag-container"></div>
            </div>
        </div>

        <div>
            <h4>Optimization Suggestions</h4>
            <ul id="resSuggestions" class="suggestions-list"></ul>
        </div>

        <div class="drive-link-box">
            <span>Archived Resume: </span>
            <a id="resFileLink" href="#" target="_blank">View File in Google Drive</a>
        </div>
    </div>
